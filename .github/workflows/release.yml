name: Release

# Pousser un tag « v* » (ex. v0.2.0) construit l'APK et le joint à une release GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Construire et publier l'APK
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepare

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Avec les secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS et KEY_PASSWORD : APK de release
      # signé. Sans eux : APK debug, publié en pré-release, pour que le workflow serve quand même.
      - name: Construire l'APK
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk Vinylify.apk
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::secrets de signature absents — APK debug publié en pré-release"
            ./gradlew :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk Vinylify.apk
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv Vinylify.apk "Vinylify-$TAG.apk"
          flags="--generate-notes"
          [ "${{ steps.build.outputs.prerelease }}" = "true" ] && flags="$flags --prerelease"
          gh release create "$TAG" "Vinylify-$TAG.apk" --title "Vinylify $TAG" $flags

      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: vinylify-apk
          path: Vinylify.apk
          retention-days: 7
