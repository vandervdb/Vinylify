name: Préparer le build
description: >
  Installe Java et Gradle et récupère l'AAR App Remote de Spotify. À appeler après le checkout
  de l'app. Le SDK (spotify-sdk) vient de Maven Central.

runs:
  using: composite
  steps:
    # L'AAR n'est pas versionné ici : il est public (Apache-2.0) dans le dépôt de Spotify.
    # L'empreinte est vérifiée pour qu'un fichier remplacé en amont ne passe pas inaperçu.
    - name: Télécharger l'AAR Spotify App Remote
      shell: bash
      env:
        AAR: spotify-app-remote-release-0.8.0.aar
        SHA256: b5a6dd880eaf01f63a871cba9ef7af77c341f8a94ffc8fdf2e9021f9a9d4c198
      run: |
        curl -fsSL "https://raw.githubusercontent.com/spotify/android-sdk/master/app-remote-lib/$AAR" -o "$AAR"
        echo "$SHA256  $AAR" | sha256sum -c -
        mkdir -p app/libs
        mv "$AAR" app/libs/

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v6
